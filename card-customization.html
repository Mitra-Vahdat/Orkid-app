<script>
(() => {
    "use strict";

    const STORAGE_KEY = "orkid-card-customizations-v1";

    const overlay = document.getElementById("cardEditorOverlay");
    const form = document.getElementById("cardEditorForm");
    const textInput = document.getElementById("editorText");
    const imageInput = document.getElementById("editorImage");
    const imagePreview = document.getElementById("editorImagePreview");
    const closeButton = document.getElementById("cardEditorClose");
    const cancelButton = document.getElementById("editorCancel");
    const deleteButton = document.getElementById("editorDelete");

    let activeCard = null;
    let pendingImage = null;

    function loadState() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch {
            return {};
        }
    }

    function saveState(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getCards() {
        return [...document.querySelectorAll(".word-card.image-card[data-card-id]")];
    }

    function updateGrid(grid) {
        if (!grid) return;
        const cards = [...grid.querySelectorAll(".word-card")];
        const columns = window.matchMedia("(max-width: 400px)").matches ? 2 : 3;
        const rows = Math.max(1, Math.ceil(cards.length / columns));
        grid.style.setProperty("--dynamic-rows", rows);
        grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
        grid.style.gridAutoRows = "unset";
    }

    function updateAllGrids() {
        updateGrid(document.querySelector(".left-grid"));
        updateGrid(document.querySelector(".right-grid"));
    }

    function cardData(card) {
        const img = card.querySelector(".image-placeholder img");
        const label = card.querySelector(":scope > span:not(.card-edit-label)");
        return {
            text: label ? label.textContent.trim() : "",
            image: img?.getAttribute("src") || "",
            alt: img?.getAttribute("alt") || ""
        };
    }

    function applySavedState() {
        const state = loadState();

        getCards().forEach(card => {
            const data = state[card.dataset.cardId];
            if (!data) return;

            if (data.deleted) {
                card.remove();
                return;
            }

            const label = card.querySelector(":scope > span:not(.card-edit-label)");
            const img = card.querySelector(".image-placeholder img");

            if (label && typeof data.text === "string") label.textContent = data.text;

            if (img && typeof data.image === "string" && data.image) {
                img.src = data.image;
                img.alt = data.text || data.alt || "";
            }

            card.dataset.word = data.text || card.dataset.word || "";
        });

        updateAllGrids();
    }

    function persistCard(card) {
        const state = loadState();
        state[card.dataset.cardId] = {
            ...cardData(card),
            deleted: false
        };
        saveState(state);
    }

    function showPreview(src, alt = "") {
        if (!src) {
            imagePreview.innerHTML = "<span>تصویر ندارد</span>";
            return;
        }

        imagePreview.innerHTML = "";
        const img = document.createElement("img");
        img.src = src;
        img.alt = alt;
        imagePreview.appendChild(img);
    }

    function openEditor(card) {
        activeCard = card;
        pendingImage = null;

        const data = cardData(card);
        textInput.value = data.text;
        imageInput.value = "";
        showPreview(data.image, data.text);

        overlay.hidden = false;
        document.body.classList.add("editor-open");
        requestAnimationFrame(() => textInput.focus());
    }

    function closeEditor() {
        overlay.hidden = true;
        document.body.classList.remove("editor-open");
        activeCard = null;
        pendingImage = null;
        form.reset();
    }

    function readImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function activateEditControl(control) {
        const card = control.closest(".word-card.image-card");
        if (card) openEditor(card);
    }

    document.addEventListener("click", (event) => {
        const control = event.target.closest(".card-edit-button");
        if (control) {
            event.preventDefault();
            event.stopPropagation();
            activateEditControl(control);
            return;
        }

        if (event.target === overlay) closeEditor();
    }, true);

    document.addEventListener("keydown", (event) => {
        const control = event.target.closest?.(".card-edit-button");
        if (control && (event.key === "Enter" || event.key === " ")) {
            event.preventDefault();
            event.stopPropagation();
            activateEditControl(control);
            return;
        }

        if (event.key === "Escape" && !overlay.hidden) closeEditor();
    });

    imageInput.addEventListener("change", async () => {
        const file = imageInput.files?.[0];
        if (!file) return;

        try {
            pendingImage = await readImage(file);
            showPreview(pendingImage, textInput.value.trim());
        } catch {
            pendingImage = null;
            alert("خواندن تصویر انجام نشد. لطفاً دوباره امتحان کن.");
        }
    });

    form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!activeCard) return;

        const newText = textInput.value.trim();
        if (!newText) {
            textInput.focus();
            return;
        }

        const img = activeCard.querySelector(".image-placeholder img");
        const label = activeCard.querySelector(":scope > span:not(.card-edit-label)");

        if (label) label.textContent = newText;
        activeCard.dataset.word = newText;

        if (img) {
            if (pendingImage) img.src = pendingImage;
            img.alt = newText;
        }

        persistCard(activeCard);
        updateAllGrids();
        closeEditor();
    });

    deleteButton.addEventListener("click", () => {
        if (!activeCard) return;

        const name = cardData(activeCard).text || "این کارت";
        if (!window.confirm(`کارت «${name}» حذف شود؟`)) return;

        const state = loadState();
        state[activeCard.dataset.cardId] = {
            ...cardData(activeCard),
            deleted: true
        };
        saveState(state);

        activeCard.remove();
        updateAllGrids();
        closeEditor();
    });

    closeButton.addEventListener("click", closeEditor);
    cancelButton.addEventListener("click", closeEditor);
    window.addEventListener("resize", updateAllGrids);

    // Developer helper: reset all saved card customizations.
    window.resetOrkidCardCustomizations = () => {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    };

    applySavedState();
})();
</script>
