<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تنظیمات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="./css/setting.css"
    >

<link rel="stylesheet" href="./css/mobile-improvements.css">
<link rel="stylesheet" href="./css/landscape-mobile.css"></head>

<body>

    <main class="settings-page">

        <header class="settings-header">

            <button
                class="back-button"
                id="backButton"
                aria-label="بازگشت"
            >
                <span>‹</span>
            </button>

            <h1>تنظیمات</h1>

            <div class="header-space"></div>

        </header>

        <section class="settings-content">

            <section class="setting-section">

                <h2>رنگ صفحه</h2>

                <p class="setting-description">
                    رنگ مورد علاقه‌ات را انتخاب کن
                </p>

                <button type="button" id="openThemeDialog" class="theme-open-button" aria-haspopup="dialog">🎨 انتخاب رنگ صفحه</button>
<div id="themeDialog" class="theme-dialog" hidden>
 <div class="theme-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="themeDialogTitle">
  <div class="theme-dialog-head"><h2 id="themeDialogTitle">انتخاب تم</h2><button type="button" id="closeThemeDialog" aria-label="بستن پنجره">✕</button></div>
  <div class="theme-options">
   <button type="button" class="theme-button theme-pink" data-theme="pink" aria-label="صورتی"><span></span><small>صورتی</small></button>
   <button type="button" class="theme-button theme-green" data-theme="green" aria-label="سبز"><span></span><small>سبز</small></button>
   <button type="button" class="theme-button theme-yellow" data-theme="yellow" aria-label="زرد"><span></span><small>زرد</small></button>
   <button type="button" class="theme-button theme-blue" data-theme="blue" aria-label="آبی"><span></span><small>آبی</small></button>
   <button type="button" class="theme-button theme-purple" data-theme="purple" aria-label="بنفش پاستلی"><span></span><small>بنفش پاستلی</small></button>
  </div>
 </div>
</div>
</section>

            <section class="setting-section">

                <div class="setting-title-row">

                    <h2>نور صفحه</h2>

                    <span
                        id="brightnessValue"
                        class="value-label"
                    >
                        100٪
                    </span>

                </div>

                <div class="brightness-control">

                    <span class="brightness-icon">
                        ☼
                    </span>

                    <input
                        type="range"
                        id="brightnessSlider"
                        min="40"
                        max="100"
                        value="100"
                        step="1"
                    >

                    <span class="brightness-icon small">
                        ☀
                    </span>

                </div>

            </section>

            <section class="setting-section">

                <h2>صدای خواندن</h2>

                <p class="setting-description">
                    صدای مورد علاقه‌ات را انتخاب کن
                </p>

                <div class="voice-options">

                    <button
                        class="voice-button active"
                        data-voice="female"
                    >

                        <div class="voice-icon">
                            ♀
                        </div>

                        <span>
                            صدای زن
                        </span>

                    </button>

                    <button
                        class="voice-button"
                        data-voice="male"
                    >

                        <div class="voice-icon">
                            ♂
                        </div>

                        <span>
                            صدای مرد
                        </span>

                    </button>

                </div>

            </section>

            <section class="card-customization">

                <button
                    class="customize-button"
                    id="customizeCards"
                >

                    <div class="customize-icon">
                        ✦
                    </div>

                    <div class="customize-text">

                        <strong>
                            شخصی‌سازی کارت‌ها
                        </strong>

                        <span>
                            عکس و کلمات کارت‌ها را تغییر بده
                        </span>

                    </div>

                    <div class="arrow">
                        ‹
                    </div>

                </button>

            </section>
            <section class="setting-section">
              <h2>افزودن کارت</h2>
              <p class="setting-description">برای هر ردیف به‌صورت جداگانه کارت اضافه کنید.</p>
              <div class="add-card-options">
                <button type="button" class="add-card-row" data-side="left">＋ افزودن کارت به ردیف افراد</button>
                <button type="button" class="add-card-row" data-side="right">＋ افزودن کارت به ردیف نیازها</button>
              </div>
              <p id="addCardMessage" role="status" aria-live="polite"></p>
            </section>
        </section>

    </main>

    <script src="./js/setting.js"></script>
<script src="./js/card-additions.js"></script>

    <script src="./js/pwa.js"></script>
<script src="./js/navigation.js"></script></body>

</html>
