<!DOCTYPE html>

<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AAC Communication UI</title>
<link href="./css/style.css" rel="stylesheet"/>
<link href="./manifest.json" rel="manifest"/>
<meta content="#ffffff" name="theme-color"/>
<meta content="yes" name="mobile-web-app-capable"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="default" name="apple-mobile-web-app-status-bar-style"/>
<meta content="ارکید" name="apple-mobile-web-app-title"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
</head>
<body>
<div class="app">
<aside class="left-sidebar">
<div class="top-icons">
<button class="circle-icon" id="educationButton" type="button">
<img alt="آموزش" src="images/ico/mdi-light--account.svg"/>
</button>
<button class="circle-icon" id="historyButton">
<img alt="تاریخچه" src="images/ico/mdi-light--clock.svg"/>
</button>
<button class="circle-icon" id="settingsButton" type="button">
<img alt="تنظیمات" src="images/ico/settings.png"/>
</button>
</div>
<div class="left-grid">
<button class="word-card image-card" data-card-id="left-1" data-word="بابا">
<div class="image-placeholder">
<img alt="بابا" src="images/cards/بابا.png"/>
</div>
<span class="word-label">بابا</span>
</button>
<button class="word-card image-card" data-card-id="left-2" data-word="مامان">
<div class="image-placeholder">
<img alt="مامان" src="images/cards/مامان.png"/>
</div>
<span class="word-label">مامان</span>
</button>
<button class="word-card image-card" data-card-id="left-3" data-word="تکرار">
<div class="image-placeholder">
<img src="images/cards/غریبه.png"/>
</div>
<span class="word-label">تکرار</span>
</button>
<button class="word-card image-card" data-card-id="left-4" data-word="دوست">
<div class="image-placeholder">
<img alt="دوست" src="images/cards/قلب.png"/>
</div>
<span class="word-label">دوست</span>
</button>








</div>
</aside>
<main class="center-section">
<div class="sentence-bar">
<button class="sentence-word sentence-no" data-word="نه">
                    نه
                </button>
<button class="sentence-word sentence-yes" data-word="آره">
                    آره
                </button>
<button class="sentence-word sentence-pain" data-word="درد دارم">
                    درد دارم
                </button>
<button class="sentence-word sentence-help" data-word="کمک">
                    کمک
                </button>
</div>
<div class="main-content">
<div class="sentence-display" id="sentence-display"></div>
</div>
<div class="bottom-controls">
<button aria-label="حذف" class="control-button">
<div class="control-circle">
<img alt="حذف" src="images/ico/mdi-light--delete.svg"/>
</div>
</button>


</div>
</main>
<aside class="right-sidebar">
<div class="right-grid">
<button class="word-card image-card" data-card-id="right-1" data-word="آب">
<div class="image-placeholder">
<img alt="آب" src="images/cards/water-glass-color-icon.svg"/>
</div>
<span class="word-label">آب</span>
</button>
<button class="word-card image-card" data-card-id="right-2" data-word="غذا">
<div class="image-placeholder">
<img alt="غذا" src="images/cards/سیب.png"/>
</div>
<span class="word-label">میوه</span>
</button>
<button class="word-card image-card" data-card-id="right-3" data-word="غذا">
<div class="image-placeholder">
</div>
<span class="word-label">غذا</span>
</button>
<button class="word-card image-card" data-card-id="right-4" data-word="بازی">
<div class="image-placeholder">
<img alt="بازی" src="images/cards/توپ.png"/>
</div>
<span class="word-label">توپ</span>
</button>











</div>
</aside>
</div>
<script src="./js/card-state.js"></script>
<script src="./js/card-additions.js"></script>
<script src="./js/card-additions-render.js"></script>
<script src="./js/script.js"></script>
<script src="./js/pwa.js"></script>
<script src="./js/navigation.js"></script></body>
</html>
