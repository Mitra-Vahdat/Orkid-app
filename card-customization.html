<script>
(() => {
    "use strict";

    const STORAGE_KEY = "orkid-card-customizations-v2";
    const overlay = document.getElementById("cardEditorOverlay");
    const form = document.getElementById("cardEditorForm");
    const textInput = document.getElementById("editorText");
    const imageInput = document.getElementById("editorImage");
    const imagePreview = document.getElementById("editorImagePreview");
    const closeButton = document.getElementById("cardEditorClose");
    const cancelButton = document.getElementById("editorCancel");
    const deleteButton = document.getElementById("editorDelete");
    const saveAllButton = document.getElementById("saveAllChanges");
    const layoutButton = document.getElementById("toggleCardLayout");
    const toast = document.getElementById("customizationToast");

    if (!overlay || !form || !textInput || !imageInput || !imagePreview || !saveAllButton) {
        console.error("Orkid: customization page elements are missing.");
        return;
    }

    let activeCard = null;
    let pendingImage = null;
    let toastTimer = null;

    function loadState() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch (error) {
            console.error(error);
            return {};
        }
    }

    function loadLayoutMode() {
        return localStorage.getItem("orkid-card-image-only-mode") === "true";
    }

    function applyLayoutMode(enabled) {
        document.body.classList.toggle("cards-image-only", enabled);

        if (layoutButton) {
            layoutButton.classList.toggle("active", enabled);
            layoutButton.setAttribute("aria-pressed", String(enabled));
            layoutButton.textContent = enabled ? "نمایش متن" : "حذف متن";
        }
    }

    function toggleLayoutMode() {
        const enabled = !loadLayoutMode();
        localStorage.setItem("orkid-card-image-only-mode", String(enabled));
        applyLayoutMode(enabled);
    }

    function showToast(message, success = true) {
        toast.textContent = message;
        toast.style.background = success ? "#16803a" : "#b00020";
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function getCards(grid) {
        return [...grid.querySelectorAll(".word-card.image-card[data-card-id]")];
    }

    function cardData(card) {
        const img = card.querySelector(".image-placeholder img");
        const label = card.querySelector(":scope > .word-label");
        return {
            text: label?.textContent.trim() || "",
            image: img?.getAttribute("src") || "",
            alt: img?.getAttribute("alt") || ""
        };
    }

    function calculateColumns(grid) {
        const cards = getCards(grid);
        const count = cards.length;

        // 3 columns is the normal layout. When enough cards are removed,
        // reduce columns so the remaining cards can grow while staying square.
        let columns = 3;
        if (count <= 2) columns = Math.max(1, count);
        else if (count <= 4) columns = 2;
        else columns = 3;

        grid.style.setProperty("--card-columns", columns);
        grid.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;
    }

    function updateAllGrids() {
        document.querySelectorAll(".left-grid, .right-grid").forEach(calculateColumns);
    }

    function applySavedState() {
        const state = loadState();

        document.querySelectorAll(".word-card.image-card[data-card-id]").forEach(card => {
            const saved = state[card.dataset.cardId];
            if (!saved) return;

            if (saved.deleted) {
                card.remove();
                return;
            }

            const label = card.querySelector(":scope > .word-label");
            const img = card.querySelector(".image-placeholder img");

            if (label && typeof saved.text === "string") label.textContent = saved.text;
            if (img && saved.image) {
                img.src = saved.image;
                img.alt = saved.text || saved.alt || "";
            }

            card.dataset.word = saved.text || card.dataset.word || "";
        });

        updateAllGrids();
    }

    function showPreview(src, alt = "") {
        imagePreview.innerHTML = "";
        if (!src) {
            imagePreview.innerHTML = "<span>تصویر ندارد</span>";
            return;
        }

        const img = document.createElement("img");
        img.src = src;
        img.alt = alt;
        imagePreview.appendChild(img);
    }

    function openEditor(card) {
        activeCard = card;
        pendingImage = null;
        const data = cardData(card);
        textInput.value = data.text;
        imageInput.value = "";
        showPreview(data.image, data.text);
        overlay.hidden = false;
        document.body.classList.add("editor-open");
        requestAnimationFrame(() => textInput.focus());
    }

    function closeEditor() {
        overlay.hidden = true;
        document.body.classList.remove("editor-open");
        activeCard = null;
        pendingImage = null;
        form.reset();
    }

    function readImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // Explicitly save every current card. Deleted cards are stored too.
    function saveAllChanges() {
        const oldState = loadState();
        const newState = { ...oldState };
        const visibleIds = new Set();

        document.querySelectorAll(".word-card.image-card[data-card-id]").forEach(card => {
            const id = card.dataset.cardId;
            visibleIds.add(id);
            newState[id] = {
                ...cardData(card),
                deleted: false
            };
        });

        // Any original editable card that no longer exists was deleted.
        Object.keys(oldState).forEach(id => {
            if ((id.startsWith("left-") || id.startsWith("right-")) && !visibleIds.has(id)) {
                newState[id] = {
                    ...oldState[id],
                    deleted: true
                };
            }
        });

        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(newState));
            saveAllButton.classList.add("saved");
            saveAllButton.textContent = "ذخیره شد ✓";
            showToast("تغییرات با موفقیت ذخیره شد");
            setTimeout(() => {
                saveAllButton.classList.remove("saved");
                saveAllButton.textContent = "ذخیره تغییرات";
            }, 1500);
        } catch (error) {
            console.error(error);
            showToast("ذخیره تغییرات انجام نشد", false);
        }
    }

    document.addEventListener("click", event => {
        const edit = event.target.closest(".card-edit-button");
        if (edit) {
            event.preventDefault();
            event.stopPropagation();
            const card = edit.closest(".word-card.image-card");
            if (card) openEditor(card);
            return;
        }

        if (event.target === overlay) closeEditor();
    }, true);

    document.addEventListener("keydown", event => {
        const edit = event.target.closest?.(".card-edit-button");
        if (edit && (event.key === "Enter" || event.key === " ")) {
            event.preventDefault();
            const card = edit.closest(".word-card.image-card");
            if (card) openEditor(card);
        }
        if (event.key === "Escape" && !overlay.hidden) closeEditor();
    });

    imageInput.addEventListener("change", async () => {
        const file = imageInput.files?.[0];
        if (!file) return;
        try {
            pendingImage = await readImage(file);
            showPreview(pendingImage, textInput.value.trim());
        } catch {
            pendingImage = null;
            showToast("خواندن تصویر انجام نشد", false);
        }
    });

    form.addEventListener("submit", event => {
        event.preventDefault();
        if (!activeCard) return;

        const newText = textInput.value.trim();
        if (!newText) {
            textInput.focus();
            return;
        }

        const label = activeCard.querySelector(":scope > .word-label");
        const img = activeCard.querySelector(".image-placeholder img");

        if (label) label.textContent = newText;
        activeCard.dataset.word = newText;

        if (img) {
            if (pendingImage) img.src = pendingImage;
            img.alt = newText;
        }

        // Changes remain pending until the red top button is pressed.
        updateAllGrids();
        closeEditor();
    });

    deleteButton.addEventListener("click", () => {
        if (!activeCard) return;
        const name = cardData(activeCard).text || "این کارت";
        if (!confirm(`کارت «${name}» حذف شود؟`)) return;

        activeCard.remove();
        updateAllGrids();
        closeEditor();
    });

    closeButton?.addEventListener("click", closeEditor);
    cancelButton?.addEventListener("click", closeEditor);
    saveAllButton.addEventListener("click", saveAllChanges);
    window.addEventListener("resize", updateAllGrids);

    window.resetOrkidCardCustomizations = () => {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    };

    window.addEventListener("resize", updateAllGrids);

    if (layoutButton) {
        layoutButton.addEventListener("click", toggleLayoutMode);
    }

    applyLayoutMode(loadLayoutMode());
    applySavedState();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js", { scope: "/" })
            .then(registration => console.log("PWA ready:", registration.scope))
            .catch(err => console.error("PWA error:", err));
    });
}
</script>
