<!DOCTYPE html>

<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AAC Communication UI</title>
<link href="./css/style.css" rel="stylesheet"/>
<link href="./manifest.json" rel="manifest"/>
<meta content="#ffffff" name="theme-color"/>
<meta content="yes" name="mobile-web-app-capable"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="default" name="apple-mobile-web-app-status-bar-style"/>
<meta content="ارکید" name="apple-mobile-web-app-title"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./css/mobile-improvements.css">
<link rel="stylesheet" href="./css/landscape-mobile.css"><link rel="stylesheet" href="./css/card-default-layout.css"></head>
<body>
<div class="app">
<aside class="left-sidebar">
<div class="top-icons">
<button class="circle-icon" id="educationButton" type="button">
<img alt="آموزش" src="images/ico/mdi-light--account.svg"/>
</button>
<button class="circle-icon" id="historyButton">
<img alt="تاریخچه" src="images/ico/mdi-light--clock.svg"/>
</button>
<button class="circle-icon" id="settingsButton" type="button">
<img alt="تنظیمات" src="images/ico/settings.png"/>
</button>
</div>
<div class="left-grid">
<button type="button" class="word-card image-card" data-card-id="default-sleeping" data-word="خوابیدن" data-speech="خوابیدن"><div class="image-placeholder"><img class="orkid-default-photo" data-photo-stem="images/education/verbs-1/sleeping" data-fallback="images/education/verbs-1/cover.svg" src="images/education/verbs-1/cover.svg" alt="خوابیدن"></div><span class="word-label">خوابیدن</span></button>
<button type="button" class="word-card image-card" data-card-id="default-brushing" data-word="مسواک زدن" data-speech="مسواک زدن"><div class="image-placeholder"><img class="orkid-default-photo" data-photo-stem="images/education/verbs-1/brushingtheteeth" data-fallback="images/education/verbs-1/03.svg" src="images/education/verbs-1/03.svg" alt="مسواک زدن"></div><span class="word-label">مسواک زدن</span></button>
<button type="button" class="word-card image-card" data-card-id="default-shouting" data-word="داد کشیدن" data-speech="داد زدن"><div class="image-placeholder"><img class="orkid-default-photo" data-photo-stem="images/education/verbs-1/shouting" data-fallback="images/education/verbs-1/cover.svg" src="images/education/verbs-1/cover.svg" alt="داد کشیدن"></div><span class="word-label">داد کشیدن</span></button>
<button type="button" class="word-card image-card" data-card-id="default-swinging" data-word="تاب بازی" data-speech="تاب بازی"><div class="image-placeholder"><img class="orkid-default-photo" data-photo-stem="images/education/verbs-1/swinging" data-fallback="images/education/verbs-1/cover.svg" src="images/education/verbs-1/cover.svg" alt="تاب بازی"></div><span class="word-label">تاب بازی</span></button>
</div>
</aside>
<main class="center-section">
<div class="sentence-bar">
<button class="sentence-word sentence-no" data-word="نه">
                    نه
                </button>
<button class="sentence-word sentence-yes" data-word="آره">
                    آره
                </button>
<button class="sentence-word sentence-pain" data-word="درد دارم">
                    درد دارم
                </button>
<button class="sentence-word sentence-help" data-word="کمک">
                    کمک
                </button>
</div>
<div class="main-content">
<div class="sentence-display" id="sentence-display"></div>
</div>
<div class="bottom-controls">
<button aria-label="حذف" class="control-button">
<div class="control-circle">
<img alt="حذف" src="images/ico/mdi-light--delete.svg"/>
</div>
</button>


</div>
</main>
<aside class="right-sidebar">
<div class="right-grid">
<button type="button" class="word-card image-card" data-card-id="default-biscuit" data-word="بیسکوییت" data-speech="بیسکویت"><div class="image-placeholder"><img class="orkid-default-photo" data-photo-stem="images/education/food/biscutes" data-fallback="images/education/food/01.svg" src="images/education/food/01.svg" alt="بیسکوییت"></div><span class="word-label">بیسکوییت</span></button>
<button type="button" class="word-card image-card" data-card-id="default-water" data-word="آب" data-speech="آب"><div class="image-placeholder"><img class="orkid-default-photo" data-photo-stem="images/education/food/water" data-fallback="images/education/food/cover.svg" src="images/education/food/cover.svg" alt="آب"></div><span class="word-label">آب</span></button>
<button type="button" class="word-card image-card" data-card-id="default-egg" data-word="تخم‌مرغ" data-speech="تخم‌مرغ"><div class="image-placeholder"><img class="orkid-default-photo" data-photo-stem="images/education/food/egg" data-fallback="images/education/food/04.svg" src="images/education/food/04.svg" alt="تخم‌مرغ"></div><span class="word-label">تخم‌مرغ</span></button>
<button type="button" class="word-card image-card" data-card-id="default-bread" data-word="نان" data-speech="نان"><div class="image-placeholder"><img class="orkid-default-photo" data-photo-stem="images/education/food/bread" data-fallback="images/education/food/02.svg" src="images/education/food/02.svg" alt="نان"></div><span class="word-label">نان</span></button>
</div>
</aside>
</div>
<script src="./js/default-card-images.js"></script>
<script src="./js/card-state.js"></script>
<script src="./js/card-additions.js"></script>
<script src="./js/card-additions-render.js"></script>
<script src="./js/script.js"></script>
<script src="./js/pwa.js"></script>
<script src="./js/navigation.js"></script></body>
</html>
