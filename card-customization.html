<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ارکید | شخصی‌سازی کارت‌ها</title>
<link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/card-customization.css">
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="card-customization-page">
<header class="customization-toolbar">
<h1 class="customization-title">حالت ویرایش</h1>
<div class="customization-toolbar-actions">
<button id="toggleCardLayout" class="customization-layout" type="button">حذف متن</button>
<button id="saveAllChanges" class="customization-save" type="button">بازگشت به صفحه اصلی</button>
</div>
</header>
<div id="customizationToast" class="customization-toast" role="status" aria-live="polite"></div>
<div class="app">
<aside class="left-sidebar">
<div class="top-icons">
<button class="circle-icon" type="button"><img src="images/ico/mdi-light--account.svg" alt=""></button>
<button class="circle-icon" type="button"><img src="images/ico/mdi-light--clock.svg" alt=""></button>
<button class="circle-icon" id="settingsButton" type="button"><img src="images/ico/settings.png" alt="تنظیمات"></button>
</div>
<div class="left-grid">
<button class="word-card image-card" data-card-id="left-1" data-word="بابا">
<div class="image-placeholder">
<img alt="بابا" src="images/cards/بابا.png"/>
</div>
<span class="word-label">بابا</span>
<span aria-label="ویرایش کارت" class="card-edit-button" role="button" tabindex="0" title="ویرایش کارت">✎</span></button>
<button class="word-card image-card" data-card-id="left-2" data-word="مامان">
<div class="image-placeholder">
<img alt="مامان" src="images/cards/مامان.png"/>
</div>
<span class="word-label">مامان</span>
<span aria-label="ویرایش کارت" class="card-edit-button" role="button" tabindex="0" title="ویرایش کارت">✎</span></button>
<button class="word-card image-card" data-card-id="left-3" data-word="تکرار">
<div class="image-placeholder">
<img src="images/cards/غریبه.png"/>
</div>
<span class="word-label">تکرار</span>
<span aria-label="ویرایش کارت" class="card-edit-button" role="button" tabindex="0" title="ویرایش کارت">✎</span></button>
<button class="word-card image-card" data-card-id="left-4" data-word="دوست">
<div class="image-placeholder">
<img alt="دوست" src="images/cards/قلب.png"/>
</div>
<span class="word-label">دوست</span>
<span aria-label="ویرایش کارت" class="card-edit-button" role="button" tabindex="0" title="ویرایش کارت">✎</span></button>
</div>
</aside>
<main class="center-section">
<div class="sentence-bar">
<button class="sentence-word sentence-no" data-word="نه">نه</button>
<button class="sentence-word sentence-yes" data-word="آره">آره</button>
<button class="sentence-word sentence-pain" data-word="درد دارم">درد دارم</button>
<button class="sentence-word sentence-help" data-word="کمک">کمک</button>
</div>
<div class="main-content"><div class="sentence-display"></div></div>
<div class="bottom-controls"><button aria-label="حذف" class="control-button" type="button"><div class="control-circle"><img src="images/ico/mdi-light--delete.svg" alt="حذف"></div></button></div>
</main>
<aside class="right-sidebar"><div class="right-grid">
<button class="word-card image-card" data-card-id="right-1" data-word="آب">
<div class="image-placeholder">
<img alt="آب" src="images/cards/water-glass-color-icon.svg"/>
</div>
<span class="word-label">آب</span>
<span aria-label="ویرایش کارت" class="card-edit-button" role="button" tabindex="0" title="ویرایش کارت">✎</span></button>
<button class="word-card image-card" data-card-id="right-2" data-word="غذا">
<div class="image-placeholder">
<img alt="غذا" src="images/cards/سیب.png"/>
</div>
<span class="word-label">میوه</span>
<span aria-label="ویرایش کارت" class="card-edit-button" role="button" tabindex="0" title="ویرایش کارت">✎</span></button>
<button class="word-card image-card" data-card-id="right-3" data-word="غذا">
<div class="image-placeholder">
</div>
<span class="word-label">غذا</span>
<span aria-label="ویرایش کارت" class="card-edit-button" role="button" tabindex="0" title="ویرایش کارت">✎</span></button>
<button class="word-card image-card" data-card-id="right-4" data-word="بازی">
<div class="image-placeholder">
<img alt="بازی" src="images/cards/توپ.png"/>
</div>
<span class="word-label">توپ</span>
<span aria-label="ویرایش کارت" class="card-edit-button" role="button" tabindex="0" title="ویرایش کارت">✎</span></button>
</div></aside>
</div>
<div id="cardEditorOverlay" class="card-editor-overlay" hidden>
<section class="card-editor-modal" role="dialog" aria-modal="true" aria-labelledby="cardEditorTitle">
<header class="card-editor-header"><h2 id="cardEditorTitle">ویرایش کارت</h2><button id="cardEditorClose" class="card-editor-close" type="button">×</button></header>
<form id="cardEditorForm" class="card-editor-form">
<div class="editor-image-preview-wrap"><div id="editorImagePreview" class="editor-image-preview"></div></div>
<label class="editor-field"><span>متن کارت</span><input id="editorText" type="text" autocomplete="off"></label>
<label class="editor-field"><span>تصویر کارت</span><input id="editorImage" type="file" accept="image/*"><small>تصویر انتخاب‌شده داخل حافظه مرورگر ذخیره می‌شود.</small></label>
<button id="openLessonPicker" type="button" class="editor-save">انتخاب از کارت‌های آموزشی</button>
<details id="aiPersonalizePanel" class="ai-personalize"><summary>✨ ساخت تصویر آموزشی با هوش مصنوعی</summary>
<div class="ai-content"><p class="ai-hint">ابتدا از بخش «انتخاب از کارت‌های آموزشی» یک فعالیت را انتخاب کنید، سپس عکس فرد آشنا را وارد کنید.</p>
<label class="ai-field">عکس فرد آشنا<input id="aiReference" type="file" accept="image/jpeg,image/png,image/webp"></label>
<label class="ai-consent"><input id="aiConsent" type="checkbox"> با رضایت صاحب عکس، آن را برای پردازش به سرویس ابری ارسال می‌کنم.</label>
<div class="ai-actions"><button id="aiPrepare" type="button">نمایش عکس مرجع</button><button id="aiGenerate" type="button">ساخت تصویر با AI</button></div>
<p id="aiStatus" role="status" aria-live="polite"></p>
<div id="aiPreviewArea" hidden><img id="aiPreview" alt="پیش‌نمایش تصویر"/><p id="aiPreviewNote"></p><button id="aiUseReference" type="button">استفاده از این تصویر در کارت</button></div></div></details><div class="editor-actions"><button id="editorDelete" class="editor-delete" type="button">حذف کارت</button><div class="editor-actions-right"><button id="editorCancel" class="editor-cancel" type="button">انصراف</button><button class="editor-save" type="submit">اعمال تغییر</button></div></div>
</form></section></div>
<section id="lessonPicker" class="lesson-picker" hidden role="dialog" aria-modal="true"><div class="lesson-picker-panel"><button type="button" id="closeLessonPicker">بستن</button><h2>انتخاب کارت آموزشی</h2><select id="lessonCategory" aria-label="دسته‌بندی"></select><div id="lessonChoices" class="lesson-choices"></div></div></section>
<script src="./js/ai-personalization.js"></script><script src="./js/card-state.js"></script>
<script src="./js/card-additions.js"></script>
<script src="./js/card-additions-render.js"></script><script src="./js/education.js"></script><script src="./js/card-customization.js"></script><script src="./js/pwa.js"></script>
<script src="./js/navigation.js"></script></body></html>
